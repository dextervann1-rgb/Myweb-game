apply plugin: 'com.android.application'

android {
    namespace "com.abbadivinevision.omega"
    compileSdk rootProject.ext.compileSdkVersion ?: 36
    defaultConfig {
        applicationId "com.abbadivinevision.omega"
        minSdk rootProject.ext.minSdkVersion ?: 24
        targetSdk rootProject.ext.targetSdkVersion ?: 36
        versionCode 10200
        versionName "1.2.0-alpha"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        manifestPlaceholders = [
            'appAuthRedirectScheme': 'omega'
        ]
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE')) {
                storeFile file(RELEASE_STORE_FILE)
                storePassword RELEASE_STORE_PASSWORD
                keyAlias RELEASE_KEY_ALIAS
                keyPassword RELEASE_KEY_PASSWORD
            } else {
                storeFile file("../../omega-release.keystore")
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "omega12345"
                keyAlias "omega"
                keyPassword System.getenv("KEY_PASSWORD") ?: "omega12345"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
